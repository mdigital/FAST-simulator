<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAST Table Simulator</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body data-view="flat">
  <header class="bar">
    <strong class="brand">FAST simulator</strong>
    <select id="work" aria-label="Work" hidden></select>
    <form id="src-form" class="src">
      <input id="src" type="text" spellcheck="false" autocomplete="off" aria-label="Content URL" placeholder="Content URL">
      <select id="layout" aria-label="Tools on the table">
        <option value="touch" selected>Touch table (no tools)</option>
        <option value="open">Mouse (no tools)</option>
        <option value="objects">FAST: objects (A)</option>
        <option value="quiz">FAST: quiz buttons (B)</option>
        <option value="dial">FAST: dial (C)</option>
        <option value="sandbox">FAST: all tools</option>
      </select>
      <button type="submit">Load</button>
    </form>
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-view-btn="flat" aria-pressed="true">Flat</button>
      <button type="button" data-view-btn="3d" aria-pressed="false">3D</button>
    </div>
    <button type="button" id="enter-vr" class="xr" disabled>Enter VR</button>
    <button type="button" id="enter-ar" class="xr" disabled>Passthrough</button>
    <button type="button" id="fullscreen" title="Full screen" aria-label="Full screen">⛶</button>
    <a id="open-full" class="iconlink" target="_blank" rel="noopener" title="Open in a new tab" aria-label="Open in a new tab">↗</a>
    <span id="status" class="status"></span>
  </header>

  <main id="stage">
    <div id="flat-stage">
      <div id="table-space">
        <div id="screen-wrap">
          <iframe id="content" title="Table content" width="1920" height="1080"
            allow="autoplay; fullscreen; xr-spatial-tracking"></iframe>
          <div id="overlay"></div>
        </div>
        <div id="tools-layer"></div>
      </div>
    </div>
    <div id="three-stage"></div>
  </main>

  <footer class="hint">
    <span id="about"></span>
    <span id="hint"></span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
