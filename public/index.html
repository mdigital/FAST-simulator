<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAST Table Simulator</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body data-view="flat">
  <header class="bar">
    <strong class="brand">FAST simulator</strong>
    <form id="src-form" class="src">
      <input id="src" type="text" spellcheck="false" autocomplete="off" aria-label="Content URL" placeholder="Content URL">
      <button type="submit">Load</button>
    </form>
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-view-btn="flat" aria-pressed="true">Flat</button>
      <button type="button" data-view-btn="3d" aria-pressed="false">3D</button>
    </div>
    <button type="button" id="enter-vr" class="xr" disabled>Enter VR</button>
    <button type="button" id="enter-ar" class="xr" disabled>Passthrough</button>
    <label class="toggle" title="Turn mouse input into touch events, like the real table produces (needs same-origin content)">
      <input type="checkbox" id="mouse-touch" checked> Mouse = touch
    </label>
    <button type="button" id="fullscreen" title="Full screen">⛶</button>
    <span id="status" class="status"></span>
  </header>

  <main id="stage">
    <div id="flat-stage">
      <div id="screen-wrap">
        <iframe id="content" title="Table content" width="1920" height="1080"
          allow="autoplay; fullscreen; xr-spatial-tracking"></iframe>
        <div id="overlay"></div>
      </div>
    </div>
    <div id="three-stage"></div>
  </main>

  <footer class="hint" id="hint"></footer>

  <script type="module" src="app.js"></script>
</body>
</html>
