<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>FAST demo content</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font: 28px/1.3 system-ui, sans-serif; color: #10202b;
    background: linear-gradient(135deg, #e9f6ff, #fdf2e3);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  h1 { position: absolute; left: 60px; top: 30px; margin: 0; font-size: 56px; }
  .sub { position: absolute; left: 62px; top: 105px; color: #4a5a66; }
  .card {
    position: absolute; width: 300px; height: 200px; border-radius: 24px;
    display: grid; place-items: center; font-weight: 700; font-size: 36px; color: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,.25); transform-origin: 50% 50%;
  }
  .side { position: absolute; right: 60px; top: 60px; width: 420px; display: grid; gap: 20px; }
  button.big {
    font: 700 34px system-ui, sans-serif; padding: 26px; border: 0; border-radius: 20px;
    background: #10202b; color: #fff;
  }
  button.big:active { background: #2a7fb8; }
  .list {
    height: 470px; overflow-y: auto; touch-action: pan-y; background: #fff; border-radius: 20px;
    box-shadow: inset 0 0 0 2px #d4dee6;
  }
  .list div { padding: 20px 26px; border-bottom: 1px solid #e6edf2; }
  #log { position: absolute; left: 60px; bottom: 30px; color: #4a5a66; font: 24px ui-monospace, monospace; }
  .ring { position: absolute; width: 90px; height: 90px; margin: -45px; border-radius: 50%;
    border: 5px solid #ff5a36; pointer-events: none; }
  a { color: #1769aa; }
</style>
</head>
<body>
  <h1>FAST simulator demo</h1>
  <div class="sub">Drag, pinch and rotate the cards. <a href="canvas.html">Canvas demo →</a></div>

  <div class="card" style="left:200px; top:300px; background:#e4572e">Drag me</div>
  <div class="card" style="left:620px; top:420px; background:#17bebb">Pinch me</div>
  <div class="card" style="left:300px; top:700px; background:#6a4c93">Rotate me</div>

  <div class="side">
    <button class="big" id="tap">Tapped 0 times</button>
    <div class="list" id="list"></div>
  </div>

  <div id="log">touches: 0</div>

<script>
  // Multi-touch transform for each card, using pointer events.
  for (const card of document.querySelectorAll('.card')) {
    const st = { x: 0, y: 0, s: 1, r: 0 };
    const pts = new Map();
    let last = null;
    const apply = () => (card.style.transform = `translate(${st.x}px,${st.y}px) rotate(${st.r}rad) scale(${st.s})`);
    const snapshot = () => {
      const p = [...pts.values()];
      if (p.length === 1) return { cx: p[0].x, cy: p[0].y, d: 0, a: 0 };
      const [a, b] = p;
      return { cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, d: Math.hypot(b.x - a.x, b.y - a.y), a: Math.atan2(b.y - a.y, b.x - a.x) };
    };
    card.addEventListener('pointerdown', (e) => {
      card.setPointerCapture(e.pointerId);
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      card.parentNode.appendChild(card);
      last = snapshot();
    });
    card.addEventListener('pointermove', (e) => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const now = snapshot();
      st.x += now.cx - last.cx;
      st.y += now.cy - last.cy;
      if (pts.size > 1 && last.d > 0) {
        st.s = Math.min(3, Math.max(0.4, st.s * (now.d / last.d)));
        st.r += now.a - last.a;
      }
      last = now;
      apply();
    });
    const end = (e) => {
      pts.delete(e.pointerId);
      last = pts.size ? snapshot() : null;
    };
    card.addEventListener('pointerup', end);
    card.addEventListener('pointercancel', end);
  }

  let taps = 0;
  document.getElementById('tap').addEventListener('click', (e) => {
    e.target.textContent = `Tapped ${++taps} time${taps === 1 ? '' : 's'}`;
  });

  const list = document.getElementById('list');
  for (let i = 1; i <= 30; i++) {
    const d = document.createElement('div');
    d.textContent = `Scrollable item ${i}`;
    list.appendChild(d);
  }

  // Show active touches.
  const rings = new Map();
  const log = document.getElementById('log');
  const show = (e) => {
    log.textContent = `touches: ${e.touches.length}`;
    const live = new Set();
    for (const t of e.touches) {
      live.add(t.identifier);
      let r = rings.get(t.identifier);
      if (!r) { r = document.createElement('div'); r.className = 'ring'; document.body.appendChild(r); rings.set(t.identifier, r); }
      r.style.left = t.clientX + 'px';
      r.style.top = t.clientY + 'px';
    }
    for (const [id, r] of rings) if (!live.has(id)) { r.remove(); rings.delete(id); }
  };
  for (const t of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) document.addEventListener(t, show, { passive: true });
</script>
</body>
</html>
