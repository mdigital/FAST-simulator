<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>FAST canvas demo</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0d1117; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
  // Full-screen canvas app: finger painting with animated particles.
  // The simulator draws a full-screen canvas straight onto the 3D table.
  const c = document.getElementById('c');
  const g = c.getContext('2d');
  const strokes = [];
  const fingers = new Map();
  const sparks = [];
  const colors = ['#ff5a36', '#17bebb', '#ffd23f', '#a78bfa', '#4cc2ff'];
  let n = 0;

  c.addEventListener('pointerdown', (e) => {
    c.setPointerCapture(e.pointerId);
    const s = { color: colors[n++ % colors.length], pts: [[e.clientX, e.clientY]] };
    strokes.push(s);
    fingers.set(e.pointerId, s);
  });
  c.addEventListener('pointermove', (e) => {
    const s = fingers.get(e.pointerId);
    if (!s) return;
    s.pts.push([e.clientX, e.clientY]);
    for (let i = 0; i < 3; i++) sparks.push({ x: e.clientX, y: e.clientY, vx: Math.random() * 6 - 3, vy: Math.random() * 6 - 3, life: 1, color: s.color });
  });
  const end = (e) => fingers.delete(e.pointerId);
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', end);

  function frame(t) {
    g.fillStyle = '#0d1117';
    g.fillRect(0, 0, 1920, 1080);
    g.fillStyle = '#e6edf3';
    g.font = '600 48px system-ui, sans-serif';
    g.fillText('Canvas demo: paint with your fingers', 60, 90);
    g.font = '28px system-ui, sans-serif';
    g.fillStyle = '#8b949e';
    g.fillText(`${fingers.size} finger(s) down · ${strokes.length} strokes · double-tap the top bar to clear`, 60, 140);

    // a spinning marker shows the animation loop is alive
    g.save();
    g.translate(1800, 100);
    g.rotate(t / 500);
    g.fillStyle = '#4cc2ff';
    g.fillRect(-30, -30, 60, 60);
    g.restore();

    g.lineCap = g.lineJoin = 'round';
    g.lineWidth = 14;
    for (const s of strokes) {
      g.strokeStyle = s.color;
      g.beginPath();
      s.pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
      if (s.pts.length === 1) g.lineTo(s.pts[0][0] + 0.1, s.pts[0][1]);
      g.stroke();
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx; p.y += p.vy; p.life -= 0.03;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      g.globalAlpha = p.life;
      g.fillStyle = p.color;
      g.beginPath();
      g.arc(p.x, p.y, 6, 0, Math.PI * 2);
      g.fill();
    }
    g.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  let lastTap = 0;
  c.addEventListener('pointerup', (e) => {
    if (e.clientY > 170) return;
    if (e.timeStamp - lastTap < 400) strokes.length = 0;
    lastTap = e.timeStamp;
  });
</script>
</body>
</html>
